:root{
--ink:#16325C;--ink2:#2E4A75;--soft:#5A6E8C;--bg:#EDF3FA;--card:#FFFFFF;--line:#D3E0EF;--tint:#E5EEF9;
--violet:#1E6FD9;--dviolet:#1450A3;--pink:#0B9488;--orange:#EB6E0C;--yellow:#FFC233;--blue:#24477F;--green:#1E9A55;--teal2:#C77C02;
--redc:#D63A3A;--okc:#0EA35F;--okw:#E3F8EC;--badc:#E5373A;--badw:#FFE8E6;
/* names used by the page code */
--teal:var(--blue);--red:var(--orange);--brown:var(--violet);--taupe:var(--pink);
--a-sim:#1E6FD9;--a-con:#EB6E0C;--a-per:#1E9A55;--a-pcn:#C93636;
--w-sim:#E3EEFB;--w-con:#FFF0E1;--w-per:#E2F5EA;--w-pcn:#FBE6E6;
--disp:"Fredoka","Baloo 2","Varela Round","Arial Rounded MT Bold","Segoe UI",sans-serif;
--script:var(--disp);
--body:"Nunito","Varela Round","Segoe UI",Calibri,Carlito,"Helvetica Neue",Arial,sans-serif;
--bar:2.4rem;--bot:2.6rem;--r:1.1rem}
html{font-size:28px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);line-height:1.45;background:var(--bg);
background-image:radial-gradient(circle at 8% 12%,rgba(11,148,136,.10) 0 9rem,transparent 9rem),radial-gradient(circle at 95% 30%,rgba(30,111,217,.10) 0 11rem,transparent 11rem),radial-gradient(circle at 10% 85%,rgba(255,194,60,.16) 0 10rem,transparent 10rem),radial-gradient(circle at 90% 90%,rgba(36,71,127,.08) 0 12rem,transparent 12rem);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:600;line-height:1.15;margin:0}
b,strong{font-weight:800}
/* top and bottom bars */
#top{position:fixed;top:0;left:0;right:0;height:var(--bar);background:linear-gradient(90deg,#16325C,var(--violet));color:#fff;display:flex;align-items:center;gap:.3rem;padding:0 .45rem;z-index:20;box-shadow:0 .2rem .8rem rgba(22,50,92,.3)}
#ttl{flex:1;min-width:0;color:#fff;font-family:var(--disp);font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3rem}
.tb{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:2rem;min-height:1.8rem;min-width:1.8rem;padding:0 .55rem;font-size:max(15px,.8rem);font-family:var(--disp);font-weight:600}
.tb:hover,.tb:focus-visible{background:rgba(255,255,255,.35);outline:none}
#bot{position:fixed;bottom:0;left:0;right:0;min-height:var(--bot);background:#fff;display:flex;align-items:center;gap:.4rem;padding:.3rem .55rem;z-index:20;box-shadow:0 -.2rem 1rem rgba(43,35,80,.12);border-radius:1.2rem 1.2rem 0 0}
#tip{flex:1;min-width:0;color:var(--soft);font-size:max(15px,.75rem);line-height:1.25;font-weight:700}
.nb{display:flex;gap:.35rem}
.nb button{min-height:2rem;padding:0 .8rem;border-radius:2rem;border:0;background:var(--tint);color:var(--dviolet);font-family:var(--disp);font-weight:600;font-size:max(15px,.85rem);box-shadow:0 .18rem 0 var(--line)}

.nb button:disabled{opacity:.3;cursor:default}
main{max-width:1150px;margin:0 auto;padding:calc(var(--bar) + .8rem) .7rem calc(var(--bot) + 1.4rem)}
/* page header card */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-radius:1.6rem;padding:.9rem 1.1rem 1rem;margin-bottom:.8rem;box-shadow:0 .35rem 0 var(--dviolet)}
.hero::before{content:"\2728";position:absolute;right:.6rem;top:.3rem;font-size:2.2rem;opacity:.9;transform:rotate(12deg)}
.hero::after{content:"";position:absolute;right:-2rem;bottom:-2.5rem;width:7rem;height:7rem;border-radius:50%;background:rgba(255,255,255,.14)}
.eyebrow{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:max(15px,.72rem);padding:.05rem .7rem;border-radius:2rem}
.hero h1{font-size:1.75rem;margin:.35rem 0 .25rem;position:relative;z-index:1}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{margin:0;max-width:34em;font-weight:700;opacity:.95;position:relative;z-index:1}
/* home hero */
.arch{position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,#16325C 0%,var(--violet) 55%,var(--pink) 100%);color:#fff;border-radius:2rem;padding:1.2rem 1rem 1.2rem;margin:0 auto .9rem;box-shadow:0 .45rem 0 var(--dviolet)}
.arch::before{content:"\1F4DA";display:none;position:absolute;left:.7rem;top:.6rem;font-size:2.2rem;transform:rotate(-14deg)}
.arch::after{content:"\23F0";display:none;position:absolute;right:.8rem;bottom:.7rem;font-size:2.2rem;transform:rotate(12deg)}
.arch .s1{font-family:var(--disp);font-weight:500;font-size:1.2rem;opacity:.95}
.arch .s2{font-family:var(--disp);font-weight:700;font-size:2.8rem;line-height:1;margin:.15rem 0 .35rem;color:#fff;text-shadow:0 .2rem 0 rgba(43,35,80,.25)}
.sign{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:1.6rem;padding:.1rem 1rem;border-radius:2rem;transform:rotate(-3deg);box-shadow:0 .25rem 0 #D99A12}
.arch p{margin:.8rem auto 0;max-width:30em;font-weight:800}
.arch .chips3{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.arch .chips3 span{font-family:var(--disp);font-weight:600;border-radius:2rem;padding:.05rem .8rem;color:var(--ink);background:#fff!important}
.panel{background:var(--card);border-radius:var(--r);padding:.75rem .85rem;margin:.7rem 0;box-shadow:0 .3rem 1rem rgba(22,50,92,.08)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9rem,100%),1fr));gap:.6rem}
.steps div{text-align:center;padding:.6rem .5rem;background:#fff;border-radius:var(--r);box-shadow:0 .3rem 1rem rgba(22,50,92,.08);font-weight:700}
.steps .n{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;border-radius:50%;color:#fff;font-family:var(--disp);font-weight:700;font-size:1.15rem;margin-bottom:.2rem}
.steps div:nth-child(1) .n{background:var(--blue)}.steps div:nth-child(2) .n{background:var(--pink)}.steps div:nth-child(3) .n{background:var(--orange)}

/* section headings */
.ribbon{display:flex;align-items:center;gap:.5rem;margin:1.2rem 0 .6rem}
.ribbon span{background:var(--rc,var(--violet));color:#fff;font-family:var(--disp);font-weight:600;font-size:1.05rem;padding:.12rem 1rem;border-radius:2rem;box-shadow:0 .2rem 0 rgba(43,35,80,.2)}

.grid>.mcard{flex:1 1 min(11.5rem,100%);max-width:min(15rem,100%)}
/* menu tiles: bright colour blocks */
.mcard{text-align:left;color:#fff;background:var(--tc,var(--violet));background-image:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);border:0;border-radius:1.4rem;padding:.7rem .75rem .8rem;min-height:3rem;position:relative;overflow:hidden;box-shadow:0 .35rem 0 rgba(43,35,80,.22);transition:transform .15s ease}
.mcard::after{content:"";position:absolute;right:-1.4rem;bottom:-1.4rem;width:4.2rem;height:4.2rem;border-radius:50%;background:rgba(255,255,255,.16)}
.mcard:hover,.mcard:focus-visible{transform:translateY(-.2rem) rotate(-1deg);outline:none}
.mcard:active{transform:translateY(.15rem);box-shadow:0 .1rem 0 rgba(43,35,80,.22)}
.grid>.mcard:nth-child(6n+1){--tc:var(--violet)!important}.grid>.mcard:nth-child(6n+2){--tc:var(--pink)!important}.grid>.mcard:nth-child(6n+3){--tc:var(--orange)!important}
.grid>.mcard:nth-child(6n+4){--tc:var(--blue)!important}.grid>.mcard:nth-child(6n+5){--tc:var(--green)!important}.grid>.mcard:nth-child(6n+6){--tc:var(--teal2)!important}
.mcard .ic{display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;border-radius:.9rem;background:#fff;font-size:1.3rem;margin-bottom:.3rem;box-shadow:0 .15rem 0 rgba(43,35,80,.15)}
.mcard .st{display:block;font-family:var(--disp);font-weight:500;font-size:max(15px,.72rem);opacity:.9}
.mcard .tt{display:block;font-family:var(--disp);font-weight:600;font-size:1.1rem;margin:.05rem 0;line-height:1.15}
.mcard .ds{display:block;font-size:max(15px,.8rem);font-weight:700;opacity:.92}
.mcard .sc{display:inline-block;margin-top:.35rem;background:#fff;color:var(--ink);font-weight:800;border-radius:2rem;padding:0 .55rem;font-size:max(15px,.75rem)}
.mcard .stars{display:block;font-size:1rem;letter-spacing:.1em;color:var(--yellow);margin-top:.15rem;text-shadow:0 .08rem 0 rgba(0,0,0,.2)}
.mcard .stars i{font-style:normal;color:rgba(255,255,255,.4);text-shadow:none}
/* buttons */
.btn{min-height:2rem;padding:.15rem .85rem;border-radius:2rem;border:0;background:var(--tint);color:var(--dviolet);font-family:var(--disp);font-weight:600;box-shadow:0 .18rem 0 var(--line)}
.btn.pri{background:linear-gradient(90deg,var(--orange),#F59E0B);color:#fff;box-shadow:0 .18rem 0 #B4520A}

.btn:hover,.btn:focus-visible{outline:.15rem solid var(--yellow);outline-offset:.1rem}
.btn:active{transform:translateY(.1rem);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
/* tip box */
.remember{background:#FFF6DC;border-radius:var(--r);padding:.6rem .85rem .65rem 3rem;margin:.8rem 0 .6rem;position:relative;box-shadow:0 .25rem 0 #FBE3A3}
.remember::before{content:"\1F4A1";position:absolute;left:.75rem;top:.5rem;font-size:1.4rem}
.remember b.k{color:var(--orange);display:block;font-family:var(--disp);font-weight:600;font-size:1.05rem}
.note{color:var(--soft);font-size:max(15px,.8rem);font-weight:700}
.vb{font-weight:800;color:var(--dviolet);background:#E3EEFB;padding:0 .18em;border-radius:.35em}
.hp{font-weight:800;color:#fff;background:var(--orange);padding:0 .22em;border-radius:.35em}
.gap{display:inline-block;min-width:3.2em;border-radius:.4rem;text-align:center;color:var(--orange);font-weight:800;padding:0 .2em;background:#FFEEE2}
.spk{border:0;background:#E3EEFB;border-radius:50%;width:1.7rem;height:1.7rem;min-width:44px;min-height:44px;font-size:.8rem;vertical-align:middle;margin-left:.2rem;padding:0;transition:transform .15s}
.spk:hover{transform:scale(1.12) rotate(-8deg);background:#CFE0F7}
.chip{display:inline-block;background:var(--tint);color:var(--dviolet);border-radius:2rem;padding:.05rem .7rem;margin:.15rem;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:max(15px,.75rem);margin:.3rem 0;font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend i{width:.9rem;height:.9rem;border-radius:50%;display:inline-block}
.legend i.nowk{border-radius:.2rem;width:.4rem;height:1rem}
/* timeline */
svg.tl{width:100%;height:auto;display:block;max-width:760px;margin:0 auto}
svg.tl .lbl{font-family:var(--disp);font-weight:600;font-size:32px;letter-spacing:1px}
svg.tl .tg{font-family:var(--disp);font-weight:600;font-size:34px}
svg.mini .lbl,svg.mini .tg,svg.mini .nowp{display:none}
.tl.anim .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 4.5s ease-in-out infinite}
.tl.anim .dt{transform-box:fill-box;transform-origin:center;animation:popL 4.5s ease infinite}
.tl.anim .tg,.tl.anim .ah{animation:fadeL 4.5s ease infinite}
.tl.anim .nowln{animation:nowP 1.5s ease-in-out infinite}
@keyframes drawL{0%{stroke-dashoffset:1;opacity:1}38%{stroke-dashoffset:0;opacity:1}86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@keyframes popL{0%{transform:scale(0);opacity:1}8%{transform:scale(1.35)}13%{transform:scale(1)}86%{transform:scale(1);opacity:1}96%{opacity:0}100%{transform:scale(0);opacity:0}}
@keyframes fadeL{0%,30%{opacity:0}40%{opacity:1}86%{opacity:1}96%,100%{opacity:0}}
@keyframes nowP{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:640px){#bot{flex-wrap:wrap;row-gap:.15rem}#tip{flex:1 1 100%;text-align:center}.nb{flex:1 1 100%;justify-content:center}.nb button{flex:1}main{padding-bottom:calc(var(--bot) + 3rem)}}

/* pickers */
.pick{display:flex;flex-wrap:wrap;gap:.45rem;margin:.25rem 0 .55rem}
.pick button{min-height:2.1rem;border:0;background:#fff;border-radius:2rem;padding:.1rem .8rem;font-weight:800;box-shadow:0 .2rem 0 var(--line);transition:transform .12s}
.pick button:hover{transform:translateY(-.1rem)}
.pick button.on{background:var(--c,var(--violet));color:#fff;box-shadow:0 .2rem 0 rgba(43,35,80,.25)}
.plab{font-family:var(--disp);font-weight:600;color:var(--ink2);font-size:max(15px,.8rem)}
.out{background:#fff;border-radius:1.3rem;padding:.65rem .75rem;margin:.65rem 0;box-shadow:0 .35rem 0 var(--c),0 .3rem 1rem rgba(22,50,92,.08)}
.out .eyebrow{background:var(--w);color:var(--c)}
.out h2{color:var(--c);font-size:1.55rem;margin-top:.25rem}
.big{font-size:1.25rem;margin:.3rem 0;font-weight:700}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}.cmpgrid>*{min-width:0}
@media (max-width:900px){.cmpgrid{grid-template-columns:minmax(0,1fr)}}
.ab{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;background:var(--yellow);color:var(--ink);border-radius:50%;margin-right:.35rem;font-family:var(--disp);font-weight:700}
/* time words */
.wgrid{display:flex;flex-wrap:wrap;gap:.45rem}
.wgrid button{min-height:2rem;border:0;background:#fff;border-radius:2rem;padding:.05rem .8rem;font-weight:800;box-shadow:0 .2rem 0 var(--line);transition:transform .12s}
.wgrid button:hover{transform:rotate(-2deg) scale(1.04)}
.wgrid button.on{background:linear-gradient(90deg,var(--orange),#F59E0B);color:#fff;box-shadow:0 .2rem 0 #B4520A}
/* negatives and questions */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(12rem,100%),1fr));gap:.6rem}
.rule{background:#fff;border-radius:var(--r);padding:.55rem .65rem;text-align:center;box-shadow:0 .3rem 1rem rgba(22,50,92,.08)}
.rule .ic{font-size:1.6rem}
.rule b.tn{display:block;font-family:var(--disp);font-weight:600;font-size:1.1rem}
.qrow{display:grid;grid-template-columns:9rem 1fr;gap:.5rem;align-items:center;background:#fff;border-radius:1rem;padding:.35rem .55rem;margin:.35rem 0;box-shadow:inset .35rem 0 0 var(--c),0 .2rem .8rem rgba(22,50,92,.06)}
.qrow .nm{font-family:var(--disp);font-weight:600;color:var(--c);font-size:max(15px,.75rem);line-height:1.2;padding-left:.3rem}
@media (max-width:640px){.qrow{grid-template-columns:1fr;gap:.1rem}}
/* practice */
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.3rem;text-align:center}
.kicker{font-family:var(--disp);font-weight:600;color:#fff;background:var(--violet);border-radius:2rem;padding:0 .7rem;font-size:max(15px,.8rem)}
.hd h1{font-size:1.6rem;width:100%}
.streak{background:linear-gradient(90deg,var(--orange),#F59E0B);color:#fff;border-radius:2rem;padding:0 .7rem;font-weight:800;font-size:max(15px,.8rem);animation:wob .5s ease}
@keyframes wob{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.prog{height:.55rem;background:#D9E5F3;border-radius:1rem;overflow:hidden;margin:.35rem auto .1rem;max-width:30rem}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--pink),var(--violet));border-radius:1rem;transition:width .4s ease}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem;margin:.4rem 0 .7rem}
.pills button{min-width:44px;min-height:44px;border:0;background:#fff;border-radius:50%;font-family:var(--disp);font-weight:600;font-size:max(15px,.75rem);padding:0 .2rem;box-shadow:0 .15rem 0 var(--line)}
.pills button.cur{background:var(--violet);color:#fff;transform:scale(1.12)}
.pills button.ok{background:var(--okc);color:#fff;box-shadow:none}
.pills button.bad{background:var(--badc);color:#fff;box-shadow:none}
.pills button.cur.ok,.pills button.cur.bad{outline:.15rem solid var(--violet);outline-offset:.12rem}
.qbox{background:#fff;border:.2rem solid transparent;border-radius:1.6rem;padding:.8rem .9rem;box-shadow:0 .4rem 0 var(--line),0 .5rem 1.5rem rgba(22,50,92,.1)}
.qbox.ok{border-color:var(--okc);box-shadow:0 .4rem 0 #A6E7C4}
.qbox.bad{border-color:var(--badc);box-shadow:0 .4rem 0 #F8BDB9}
.qbox.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-.3rem)}40%{transform:translateX(.3rem)}60%{transform:translateX(-.2rem)}80%{transform:translateX(.2rem)}}
.stem{font-size:1.2rem;margin-bottom:.55rem;font-weight:800}
.inst{font-family:var(--disp);font-weight:500;color:var(--soft);font-size:max(15px,.8rem);margin-bottom:.35rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;min-height:2.4rem;border:.14rem solid var(--line);background:#fff;border-radius:1.1rem;padding:.25rem .7rem .25rem .3rem;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.55rem;box-shadow:0 .22rem 0 var(--line);transition:transform .12s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--violet);transform:translateY(-.1rem);outline:none}
.opt:active:not(:disabled){transform:translateY(.12rem);box-shadow:none}
.opt .lt{font-family:var(--disp);font-weight:600;color:#fff;min-width:1.65rem;height:1.65rem;border-radius:.6rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt:nth-child(1) .lt{background:var(--violet)}.opt:nth-child(2) .lt{background:var(--pink)}.opt:nth-child(3) .lt{background:var(--orange)}.opt:nth-child(4) .lt{background:var(--blue)}
.opt.ok{border-color:var(--okc);background:var(--okw);color:#08743F;box-shadow:0 .22rem 0 #A6E7C4}
.opt.ok .lt{background:var(--okc)!important}
.opt.bad{border-color:var(--badc);background:var(--badw);color:#B5221F;box-shadow:0 .22rem 0 #F8BDB9}
.opt.bad .lt{background:var(--badc)!important}
.opt:disabled{cursor:default}
.fb{margin-top:.65rem;border-radius:1.1rem;padding:.55rem .75rem}
.fb.ok{background:var(--okw)}
.fb.bad{background:var(--badw)}
.fb b.k{display:block;font-family:var(--disp);font-weight:600;font-size:1.1rem;line-height:1.25}
.fb.ok b.k{color:#08743F}.fb.bad b.k{color:#B5221F}
.tally{margin-top:.7rem;color:var(--soft);font-weight:800;font-size:max(15px,.8rem);text-align:center}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:.45rem;min-height:2.3rem;padding:.45rem;background:var(--tint);border-radius:1.1rem;margin-bottom:.55rem}
.sc2{min-height:2.1rem;border:0;background:#fff;border-radius:.9rem;padding:.15rem .6rem;text-align:left;font-size:.95rem;font-weight:800;box-shadow:0 .18rem 0 var(--line)}
.sc2.sel{background:var(--yellow);transform:rotate(-1.5deg) scale(1.03);box-shadow:0 .18rem 0 #D99A12}
.sc2.ok{background:var(--okw);color:#08743F;box-shadow:none}
.sc2.bad{background:var(--badw);color:#B5221F;box-shadow:none}
.sc2 .mv{display:block;font-size:max(15px,.7rem);color:#B5221F;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(12rem,100%),1fr));gap:.55rem}
.col{border-radius:1.1rem;background:#F3F7FC;min-height:5rem;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 .2rem .8rem rgba(22,50,92,.08)}
.col>button.ch{min-height:2.2rem;border:0;background:var(--violet);color:#fff;font-family:var(--disp);font-weight:600}
.cols .col:nth-child(2)>button.ch{background:var(--blue)}.cols .col:nth-child(3)>button.ch{background:var(--pink)}
.col.armed>button.ch{animation:wob .4s ease;box-shadow:inset 0 -.25rem 0 var(--yellow)}
.col .in{display:flex;flex-direction:column;gap:.35rem;padding:.45rem}
/* build the sentence */
.built{display:flex;flex-wrap:wrap;gap:.35rem;min-height:2.7rem;padding:.45rem;border-radius:1.1rem;background:#E3EEFB;margin-bottom:.55rem}
.tile{min-height:2.1rem;min-width:2.1rem;border:0;background:#fff;border-radius:.8rem;padding:.05rem .6rem;font-size:1rem;font-weight:800;box-shadow:0 .2rem 0 var(--line);transition:transform .1s}
.tile:hover{transform:translateY(-.1rem)}
.built .tile{background:var(--violet);color:#fff;box-shadow:0 .2rem 0 var(--dviolet)}
/* spot the mistake */
.spot{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.spot button{min-height:2.2rem;border:0;background:var(--tint);border-radius:.8rem;padding:.05rem .55rem;font-size:1.05rem;font-weight:800;box-shadow:0 .18rem 0 var(--line)}
.spot button:hover:not(:disabled){background:var(--yellow);transform:rotate(-2deg)}
.spot button.ok{background:var(--okw);color:#08743F}
.spot button.bad{background:var(--badw);color:#B5221F;text-decoration:line-through}
.spot button.was{background:var(--badw);color:#B5221F}
/* story */
.story{font-size:1.05rem;line-height:1.9;background:#FFFCF2;border-radius:1.1rem;padding:.6rem .8rem;margin-bottom:.55rem;font-weight:700}
.sg{display:inline-block;border-radius:.5rem;padding:0 .35em;font-weight:800;line-height:1.35}
.sg.now{background:var(--yellow);color:var(--ink);animation:wob .5s ease}
.sg.todo{background:#E3EEFB;color:var(--soft)}
.sg.ok{background:var(--okw);color:#08743F}
.sg.bad{background:var(--badw);color:#B5221F}
.sg s{opacity:.8}
/* score screen */
.sum{text-align:center;padding:1.1rem}
.sum .score{font-family:var(--disp);font-weight:700;font-size:2.8rem;color:var(--violet)}
.sum .bigstars{font-size:2.4rem;letter-spacing:.15em;color:var(--yellow);text-shadow:0 .12rem 0 #D99A12}
.sum .bigstars i{font-style:normal;color:#D9E5F3;text-shadow:none}
.sum .msg{font-family:var(--disp);font-weight:600;font-size:1.4rem;color:var(--green)}
.warn{background:var(--badw);border-radius:1rem;padding:.45rem .7rem;color:#B5221F;font-weight:800}
.welcome{background:var(--okw);border-radius:1rem;padding:.45rem .7rem;color:#08743F;font-weight:800;text-align:center}
.reset{text-align:center;margin-top:1.2rem}
.cf{position:fixed;width:.5rem;height:.75rem;border-radius:.15rem;pointer-events:none;z-index:50;animation:cf 1s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tl.anim .ln{stroke-dashoffset:0!important}.cf{display:none}}

/* hub menu */
.arch{padding:.9rem 1rem 1rem;background:#fff!important;color:var(--ink)!important;box-shadow:0 .3rem 0 var(--line),0 .4rem 1.2rem rgba(22,50,92,.1)!important}
.arch .s2{font-size:2.3rem;color:var(--ink)!important;text-shadow:none!important}
.arch p{margin-top:.6rem;font-size:1.1rem;color:var(--soft)}
.cont{display:flex;align-items:center;gap:.7rem;width:100%;max-width:40rem;margin:.2rem auto .4rem;text-align:left;border:0;border-radius:1.4rem;padding:.6rem .9rem;color:#fff;background:linear-gradient(90deg,var(--orange),#F59E0B);box-shadow:0 .35rem 0 #B4520A;transition:transform .12s}
.cont:hover,.cont:focus-visible{transform:translateY(-.12rem);outline:none}
.cont:active{transform:translateY(.15rem);box-shadow:0 .1rem 0 #B4520A}
.cont .cic{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;color:var(--orange);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.cont b{display:block;font-family:var(--disp);font-weight:600;font-size:1.35rem;line-height:1.1}
.cont small{display:block;font-weight:800;font-size:max(15px,.85rem);opacity:.95}
.choose{font-size:1.15rem;color:var(--ink2);margin:1rem 0 .5rem;text-align:center}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}@media (max-width:640px){.hub{grid-template-columns:minmax(0,1fr)}}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10rem,100%),1fr));gap:.8rem}
.hubcard,.lvcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15rem;border:0;border-radius:1.6rem;padding:.9rem .7rem 1rem;color:#fff;background:var(--tc);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%);box-shadow:0 .4rem 0 rgba(22,50,92,.25);transition:transform .15s}
.hubcard:hover,.hubcard:focus-visible,.lvcard:hover,.lvcard:focus-visible{transform:translateY(-.2rem);outline:none}
.hubcard:active,.lvcard:active{transform:translateY(.15rem);box-shadow:0 .1rem 0 rgba(22,50,92,.25)}
.hn{position:absolute;left:.6rem;top:.6rem;width:2rem;height:2rem;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center}
.hic{font-size:2.6rem;line-height:1.1}
.ht{font-family:var(--disp);font-weight:700;font-size:1.6rem;line-height:1.1}
.hd2{font-weight:800;font-size:max(15px,.85rem)}
.hp2{margin-top:.3rem;background:rgba(255,255,255,.95);color:var(--ink);border-radius:2rem;padding:0 .7rem;font-weight:800;font-size:max(15px,.78rem)}
.mhero{position:relative;display:flex;align-items:center;gap:.8rem;border-radius:1.6rem;padding:.8rem 1rem;color:#fff;background:var(--tc);box-shadow:0 .35rem 0 rgba(22,50,92,.22)}
.mhero .hn{position:static;flex:none}
.mhero .mic{font-size:2.4rem}
.mhero h1{font-size:1.8rem}
.mhero p{margin:0;font-weight:800}
.lrows{display:grid;gap:.6rem;max-width:44rem;margin:0 auto}
.lrow{display:flex;align-items:center;gap:.65rem;text-align:left;border:0;background:#fff;border-radius:1.3rem;padding:.55rem .8rem .55rem .6rem;box-shadow:0 .25rem 0 var(--line),0 .3rem 1rem rgba(22,50,92,.07);transition:transform .12s}
.lrow:hover,.lrow:focus-visible{transform:translateX(.2rem);outline:.15rem solid var(--violet)}
.lrow:active{transform:translateY(.12rem);box-shadow:none}
.ln2{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.lic{flex:none;font-size:1.7rem}
.ltx{flex:1;min-width:0}
.ltx b{display:block;font-family:var(--disp);font-weight:600;font-size:1.2rem;line-height:1.15}
.ltx small{display:block;color:var(--soft);font-weight:800;font-size:max(15px,.8rem)}
.lr{flex:none;font-family:var(--disp);font-size:1.6rem;color:var(--soft)}
.tick{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--green);color:#fff;font-size:.9rem}
.lstars{font-size:1rem;color:var(--yellow);letter-spacing:.05em;text-shadow:0 .06rem 0 #C98F00}
.lstars i{font-style:normal;color:var(--line);text-shadow:none}

/* ===== Mature theme overrides ===== */
:root{--ink:#1F2933;--ink2:#3E4C59;--soft:#5F6B7A;--bg:#F3F4F6;--line:#DDE2E8;--tint:#EEF2F6;
--violet:#2563A8;--dviolet:#1D4E89;--pink:#1F7A72;--orange:#C2611A;--yellow:#D99A1E;--blue:#2B3A55;--green:#2E7D4F;--teal2:#8A6A12;--redc:#B23B3B;
--okc:#2E7D4F;--okw:#E7F3EC;--badc:#B23B3B;--badw:#F9E8E8;
--a-sim:#2563A8;--a-con:#C2611A;--a-per:#2E7D4F;--a-pcn:#B23B3B;
--w-sim:#EAF1F9;--w-con:#FBF0E7;--w-per:#EAF4EE;--w-pcn:#F8ECEC;
--disp:"Lexend","Segoe UI",Calibri,Carlito,Arial,sans-serif;--script:var(--disp);
--body:"Atkinson Hyperlegible","Segoe UI",Calibri,Carlito,Arial,sans-serif;--r:.75rem}
body{background:var(--bg)!important;background-image:none!important;line-height:1.5}
h1,h2,h3,.disp{font-weight:600;letter-spacing:-.01em}
#top{background:var(--ink)!important;box-shadow:none!important;border-bottom:.15rem solid var(--violet)}
#ttl{font-weight:500}
.tb{border-radius:.45rem;background:rgba(255,255,255,.1);font-weight:500}
.tb svg{width:1em;height:1em;vertical-align:-.12em;margin-right:.25em}
#bot{border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
#tip{font-weight:400;color:var(--soft)}
.nb button{border-radius:.5rem;box-shadow:none!important;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
.nb button.pri{background:var(--violet)!important;border-color:var(--violet);color:#fff}
/* page titles */
.hero{background:#fff!important;color:var(--ink);border-radius:var(--r);box-shadow:0 1px 3px rgba(31,41,51,.08)!important;border-left:.4rem solid var(--violet);padding:.8rem 1rem}
.hero::before,.hero::after{display:none!important}
.hero h1{font-size:1.55rem;color:var(--ink)}
.hero h1 em{color:var(--violet)!important}
.hero p{color:var(--soft);font-weight:400}
.eyebrow{background:var(--tint)!important;color:var(--ink2)!important;border-radius:.3rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:max(15px,.62rem)}
.arch{text-align:left;border-radius:var(--r);border-left:.4rem solid var(--ink);padding:.9rem 1.1rem!important;box-shadow:0 1px 3px rgba(31,41,51,.08)!important}
.arch .s2{font-size:2rem!important;font-weight:700;margin:0}
.sign{display:block;background:none!important;box-shadow:none!important;transform:none!important;padding:0!important;color:var(--violet)!important;font-size:1.3rem!important;font-weight:500!important;border-radius:0}
.arch p{margin:.4rem 0 0!important;max-width:none}
.choose{text-align:left;font-size:1rem;color:var(--soft);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
/* step cards */
.hubcard,.lvcard{align-items:flex-start!important;text-align:left!important;border-radius:var(--r)!important;background-image:none!important;box-shadow:0 1px 3px rgba(31,41,51,.15)!important;padding:1rem 1.1rem!important;gap:.25rem!important;transition:filter .15s}
.hubcard:hover,.hubcard:focus-visible,.lvcard:hover,.lvcard:focus-visible{transform:none!important;filter:brightness(1.08)}
.hubcard:active,.lvcard:active{transform:none!important}
.hn{position:static!important;width:auto!important;height:auto!important;border-radius:.3rem!important;background:rgba(255,255,255,.2)!important;color:#fff!important;font-family:var(--disp);font-weight:500!important;font-size:max(15px,.72rem)!important;padding:0 .5rem;text-transform:uppercase;letter-spacing:.06em}
.hic{font-size:1rem!important;line-height:1}
.hic svg,.mic svg{width:2.2rem;height:2.2rem;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht{font-size:1.45rem!important;font-weight:600!important}
.hd2{font-weight:400!important;opacity:.95}
.hp2{background:rgba(255,255,255,.18)!important;color:#fff!important;border-radius:.3rem!important;font-weight:500!important}
.mhero{border-radius:var(--r)!important;box-shadow:0 1px 3px rgba(31,41,51,.15)!important}
.mhero h1{font-size:1.5rem}
.mhero p{font-weight:400}
.lrow{border-radius:.6rem!important;box-shadow:0 1px 2px rgba(31,41,51,.08)!important;border:1px solid var(--line)}
.lrow:hover,.lrow:focus-visible{transform:none!important;background:var(--tint);outline:none!important}
.lic{display:none!important}
.ln2{border-radius:.4rem!important;background:var(--ink)!important}
.ltx b{font-weight:600!important}
.ltx small{font-weight:400!important}
/* surfaces */
.panel{border-radius:var(--r);box-shadow:0 1px 2px rgba(31,41,51,.06)!important;border:1px solid var(--line)}
.panel h2{font-size:1.05rem}
.remember{background:#FFF8E8!important;border-left:.35rem solid var(--yellow)!important;border-radius:.5rem!important;box-shadow:none!important;padding:.55rem .85rem!important}
.remember::before{display:none!important}
.remember b.k{color:#7A5200!important;font-size:max(15px,.75rem)!important;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tlbox{border-radius:var(--r);box-shadow:none!important;border:1px solid var(--line)}
.tkey{border-radius:.5rem}
.btn{border-radius:.5rem!important;box-shadow:none!important;border:1px solid var(--line)!important;background:#fff!important;color:var(--ink)!important;font-weight:500}
.btn.pri{background:var(--violet)!important;border-color:var(--violet)!important;color:#fff!important}
.btn.tl2{color:var(--violet)!important}
.spk{background:var(--tint)!important;border:1px solid var(--line)!important;color:var(--ink2)}
.spk svg{width:.75rem;height:.75rem;fill:currentColor}
.spk:hover{transform:none!important;background:#E2E8F0!important}
.vb{background:#E8EFF8!important;color:var(--dviolet)!important;border-radius:.25em!important}
.hp{background:var(--orange)!important;border-radius:.25em!important}
.chip{border-radius:.4rem!important;background:var(--tint)!important;color:var(--ink)!important;font-weight:400}
/* answers */
.qbox{border-radius:.9rem!important;box-shadow:0 1px 3px rgba(31,41,51,.08)!important;border:1px solid var(--line)!important}
.qbox.ok{border-color:var(--okc)!important;box-shadow:inset .3rem 0 0 var(--okc)!important}

function getPart(id) { for (var i = 0; i < PARTS.length; i++) if (PARTS[i].id === id) return PARTS[i]; return null; }
function pState(p) {
  var st = S.parts[p.id];
  if (!st) st = S.parts[p.id] = {seq: shuffle(range(p.items.length)), i: 0, it: {}};
  return st;
}
function openPart(id) { S.part = id; pState(getPart(id)); go("part"); }
function itState(p, di) {
  var st = pState(p), r = st.it[di], it = p.items[di];
  if (r) return r;
  r = {done: false, pts: 0};
  if (it.t === "mcq") { r.o = shuffle(range(it.o.length)); r.pick = -1; }
  else if (it.t === "sort") { r.ord = shuffle(range(it.it.length)); r.place = {}; r.sel = -1; }
  else if (it.t === "order") { var w = range(it.words.length), sh = w, n = 0; do { sh = shuffle(w); n++; } while (n < 12 && sh.join() === w.join()); r.pool = sh; r.built = []; }
  else if (it.t === "spot") { r.pick = -1; }
  else if (it.t === "story") { r.g = 0; r.picks = []; r.ords = []; for (var g = 0; g < it.g.length; g++) r.ords.push(shuffle(range(it.g[g].o.length))); r.showFb = false; }
  st.it[di] = r;
  return r;
}
function rPart() {
  var p = getPart(S.part), st = pState(p), n = p.items.length;
  var lv = LEVELS[p.lvl];
  title(lv.name + ": " + p.title);
  if (st.i >= n) return rSummary(p, st);
  var di = st.seq[st.i], it = p.items[di], r = itState(p, di);
  var o = '<div class="hd"><span class="kicker">' + lv.name + ' | question ' + (st.i + 1) + ' of ' + n + '</span>';
  if (STREAK >= 2) o += '<span class="streak">' + STREAK + ' correct in a row</span>';
  o += '<h1>' + p.title + '</h1></div>';
  var dn = 0; for (var q2 = 0; q2 < n; q2++) { var r2 = st.it[st.seq[q2]]; if (r2 && r2.done) dn++; }
  o += '<div class="prog" aria-hidden="true"><i style="width:' + Math.round(dn / n * 100) + '%"></i></div><div class="pills">';
  for (var k = 0; k < n; k++) {
    var rr = st.it[st.seq[k]], c = k === st.i ? "cur" : "";
    if (rr && rr.done) c += rr.pts === itemMax(p.items[st.seq[k]]) ? " ok" : " bad";
    o += '<button class="' + c + '" data-a="jump" data-v="' + k + '" aria-label="Question ' + (k + 1) + '">' + (k + 1) + '</button>';
  }
  o += '</div>';
  var box = r.done ? (r.pts === itemMax(it) ? " ok" : " bad") : "";
  o += '<div class="qbox' + box + '">';
  if (it.t === "mcq") o += rMCQ(it, r);
  else if (it.t === "sort") o += rSort(it, r);
  else if (it.t === "order") o += rOrder(it, r);
  else if (it.t === "spot") o += rSpot(it, r);
  else if (it.t === "story") o += rStory(it, r);
  o += '</div>';
  var sc = partScore(p);
  o += '<div class="tally">' + (sc ? sc.got + ' right out of ' + sc.done + ' answered' + (sc.max !== sc.n ? ' (sort and story tasks count each piece)' : '') : 'Nothing answered yet.') + '</div>';
  app.innerHTML = o;
  var tips = {mcq: "Tap one answer. Read why.", sort: "Tap a sentence. Then tap a box.", order: "Tap the words in order. Tap a word again to take it back.", spot: "Tap the wrong word or words.", story: "Choose the word for the red gap."};
  setBar(tips[it.t], function () { if (st.i > 0) { st.i--; go("part"); } else { S.lvl = p.lvl; go("level"); } }, function () { st.i++; go("part"); }, st.i === n - 1 ? "Finish" : "Next");
}
function fbBox(ok, head, why) { return '<div class="fb ' + (ok ? "ok" : "bad") + '"><b class="k">' + head + '</b>' + why + '</div>'; }
function rMCQ(it, r) {
  var o = '';
  if (it.tl) o += '<div style="margin-bottom:.5rem">' + legend() + tlBox(it.tl, true) + '</div>';
  o += '<div class="stem">' + stemHTML(it.s) + '</div><div class="opts">';
  for (var k = 0; k < r.o.length; k++) {
    var di = r.o[k], cls = "";
    if (r.done) { if (di === 0) cls = " ok"; else if (di === r.pick) cls = " bad"; }
    o += '<button class="opt' + cls + '" data-a="ans" data-v="' + k + '"' + (r.done ? " disabled" : "") + '><span class="lt">' + "ABCD".charAt(k) + '</span><span>' + esc(it.o[di]) + '</span></button>';
  }
  o += '</div>';
  if (r.done) o += fbBox(r.pick === 0, r.pick === 0 ? "✔ Yes, that's right." : "✖ Not quite. The answer is: " + esc(it.o[0]), esc(it.w));
  return o;
}
function rSort(it, r) {
  var o = '<div class="stem">' + esc(it.s) + '</div><div class="inst">Tap a sentence. Then tap a box. Tap a sentence in a box to move it back.</div><div class="pool">';
  var left = 0;
  for (var k = 0; k < r.ord.length; k++) {
    var ii = r.ord[k]; if (r.place[ii] !== undefined) continue; left++;
    o += '<button class="sc2' + (r.sel === ii ? " sel" : "") + '" data-a="ssel" data-v="' + ii + '">' + esc(it.it[ii][0]) + '</button>';
  }
  if (!left) o += '<span class="note">All sentences are in a box.</span>';
  o += '</div><div class="cols">';
  for (var c = 0; c < it.cols.length; c++) {
    o += '<div class="col' + (r.sel >= 0 && !r.done ? " armed" : "") + '"><button class="ch" data-a="scol" data-v="' + c + '"' + (r.done ? " disabled" : "") + '>' + it.cols[c] + '</button><div class="in">';
    for (var m = 0; m < r.ord.length; m++) {
      var jj = r.ord[m]; if (r.place[jj] !== c) continue;
      var cls = r.done ? (it.it[jj][1] === c ? " ok" : " bad") : "";
      o += '<button class="sc2' + cls + '" data-a="sret" data-v="' + jj + '"' + (r.done ? " disabled" : "") + '>' + esc(it.it[jj][0]) + (r.done && it.it[jj][1] !== c ? '<span class="mv">Goes in: ' + it.cols[it.it[jj][1]] + '</span>' : '') + '</button>';
    }
    o += '</div></div>';
  }
  o += '</div>';
  if (!r.done && !left) o += '<div class="row" style="margin-top:.5rem"><button class="btn pri" data-a="schk">Check</button></div>';
  if (r.done) o += fbBox(r.pts === it.it.length, r.pts + " out of " + it.it.length + " in the right box.", esc(it.w));
  return o;
}
function rOrder(it, r) {
  var o = '<div class="inst">Tap the words to make a sentence.</div><div class="built">';
  for (var k = 0; k < r.built.length; k++) o += '<button class="tile" data-a="ounb" data-v="' + k + '"' + (r.done ? " disabled" : "") + '>' + esc(it.words[r.built[k]]) + '</button>';
  if (!r.built.length) o += '<span class="note">Your sentence goes here.</span>';
  o += '</div><div class="pool">';
  for (var m = 0; m < r.pool.length; m++) o += '<button class="tile" data-a="opick" data-v="' + m + '">' + esc(it.words[r.pool[m]]) + '</button>';
  o += '</div>';
  if (!r.done) o += '<div class="row">' + (r.built.length ? '<button class="btn" data-a="oclr">Clear</button>' : '') + (!r.pool.length ? '<button class="btn pri" data-a="ochk">Check</button>' : '') + '</div>';
  else o += fbBox(r.pts === 1, r.pts ? "✔ Yes, that's right." : "✖ Not quite. The answer is: " + esc(it.words.join(" ")), esc(it.w));
  return o;
}
function rSpot(it, r) {
  var o = '<div class="inst">One part of this sentence is wrong. Tap it.</div><div class="spot">';
  for (var k = 0; k < it.tk.length; k++) {
    var cls = "";
    if (r.done) { if (k === it.bad) cls = r.pick === it.bad ? "bad" : "was"; else if (k === r.pick) cls = "ok"; }
    o += '<button class="' + cls + '" data-a="spot" data-v="' + k + '"' + (r.done ? " disabled" : "") + '>' + esc(it.tk[k]) + '</button>';
  }
  o += '</div>';
  if (r.done) {
    var fixed = it.tk.slice(); fixed[it.bad] = '<b class="vb">' + esc(it.fix) + '</b>';
    for (var f = 0; f < fixed.length; f++) if (f !== it.bad) fixed[f] = esc(fixed[f]);
    o += fbBox(r.pick === it.bad, r.pick === it.bad ? "✔ Yes, you found it." : "✖ Not that one. The mistake is: " + esc(it.tk[it.bad]), "Correct: " + fixed.join(" ") + "<br>" + esc(it.w));
  }
  return o;
}
function rStory(it, r) {
  var txt = esc(it.txt).replace(/\{(\d+)\}/g, function (m0, g) {
    g = +g; var G = it.g[g];
    if (g < r.picks.length) { var pk = r.picks[g]; return pk === 0 ? '<span class="sg ok">' + esc(G.o[0]) + '</span>' : '<span class="sg bad"><s>' + esc(G.o[pk]) + '</s> ' + esc(G.o[0]) + '</span>'; }
    if (g === r.g && !r.done) return '<span class="sg now">(' + (g + 1) + ') ?</span>';
    return '<span class="sg todo">(' + (g + 1) + ')</span>';
  });
  var o = '<div class="inst">' + esc(it.title) + '</div><div class="story">' + txt + '</div>';
  if (r.showFb) {
    var last = r.picks.length - 1, G = it.g[last], pk = r.picks[last];
    o += fbBox(pk === 0, pk === 0 ? "✔ Gap " + (last + 1) + ": yes, " + esc(G.o[0]) + "." : "✖ Gap " + (last + 1) + ": the answer is " + esc(G.o[0]) + ".", esc(G.w));
    if (!r.done) o += '<div class="row" style="margin-top:.4rem"><button class="btn pri" data-a="sgnext">Next gap ›</button></div>';
  } else if (!r.done) {
    o += '<div class="inst">Gap ' + (r.g + 1) + ' of ' + it.g.length + '</div><div class="opts">';
    var ord = r.ords[r.g];
    for (var k = 0; k < ord.length; k++) o += '<button class="opt" data-a="sgans" data-v="' + k + '"><span class="lt">' + "ABCD".charAt(k) + '</span>' + esc(it.g[r.g].o[ord[k]]) + '</button>';
    o += '</div>';
  }
  if (r.done) o += '<div class="tally">This story: ' + r.pts + ' out of ' + it.g.length + ' gaps right.</div>';
  return o;
}
function rSummary(p, st) {
  var sc = partScore(p) || {got: 0, max: 0, done: 0, n: p.items.length};
  var nextP = null;
  for (var i = 0; i < PARTS.length; i++) if (PARTS[i].id === p.id && i + 1 < PARTS.length) nextP = PARTS[i + 1];
  var pct = sc.max ? sc.got / sc.max : 0;
  var msg = pct >= 0.85 ? "Excellent work!" : pct >= 0.6 ? "Good work. Try the red ones again." : "Keep going. Read the reasons, then try again.";
  var o = '<div class="panel sum"><div class="kicker">' + LEVELS[p.lvl].name + ' | ' + p.title + '</div><div class="bigstars">' + starHTML(starsFor(sc.got, sc.max)) + '</div><div class="score">' + sc.got + ' / ' + sc.max + '</div><div class="msg">' + msg + '</div>';
  if (sc.done < sc.n) o += '<div class="note">You answered ' + sc.done + ' of ' + sc.n + ' questions.</div>';
  o += '<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn" data-a="redo">Try again (new order)</button><button class="btn" data-a="lvl" data-v="' + p.lvl + '">Back to ' + LEVELS[p.lvl].name + '</button>' + (nextP ? '<button class="btn pri" data-a="part" data-v="' + nextP.id + '">Next: ' + LEVELS[nextP.lvl].name + ' ' + nextP.title + '</button>' : '') + '</div></div>';
  app.innerHTML = o;
  if (pct >= 0.6) setTimeout(function () { burst(app.querySelector(".bigstars"), 40); }, 150);
  setBar("Your score is saved on this device.", function () { st.i = p.items.length - 1; go("part"); }, nextP ? function () { openPart(nextP.id); } : null, "Next part");
}
var STREAK = 0, PENDING = "";
function finishItem(r, pts, max) { r.done = true; r.pts = pts; save(); var good = pts === (max || 1); STREAK = good ? STREAK + 1 : 0; PENDING = good ? "ok" : "bad"; }
var CF_COL = ["#1F6FEB", "#0EA5A4", "#F97316", "#FFC21A", "#16A34A", "#E5484D"];
function burst(el, n) {
  if (!el || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + Math.min(r.height / 2, 120);
  for (var i = 0; i < (n || 26); i++) {
    var d = document.createElement("span"); d.className = "cf";
    var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 160;
    d.style.left = cx + "px"; d.style.top = cy + "px"; d.style.background = CF_COL[i % CF_COL.length];
    d.style.setProperty("--dx", Math.cos(ang) * dist + "px"); d.style.setProperty("--dy", Math.sin(ang) * dist + 60 + "px"); d.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    document.body.appendChild(d);
    (function (x) { setTimeout(function () { if (x.parentNode) x.parentNode.removeChild(x); }, 1100); })(d);
  }
}
function effects() {
  if (!PENDING) return;
  var q = app.querySelector(".qbox.bad,.qbox.ok") || app.querySelector(".fb") || app.querySelector(".qbox");
  if (PENDING === "ok") burst(q); else if (q) q.classList.add("shake");
  PENDING = "";
}


/* ---------- 20. Actions ---------- */
function curItem() { var p = getPart(S.part), st = pState(p), di = st.seq[st.i]; return {p: p, st: st, it: p.items[di], r: itState(p, di)}; }
function act(a, v, el) {
  var c, x, pr;
  if (a === "ddt") { DDOPEN = DDOPEN === v ? "" : v; render(); return; }
  DDOPEN = "";
  switch (a) {
    case "home": S.resetArm = false; go("home"); break;
    case "cont": if (NEXTFN) NEXTFN(); break;
    case "grp": S.grp = v; go("menu"); break;
    case "lvl": S.lvl = +v; go("level"); break;
    case "go": go(v); break;
    case "back": if (NAV.back) NAV.back(); break;
    case "next": if (NAV.next) NAV.next(); break;
    case "sz": S.size = Math.max(0, Math.min(SIZES.length - 1, S.size + (+v))); applySize(); save(); break;
    case "full":
      try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
      break;
    case "say": say(SAY[+v] || ""); break;
    case "replay": case "replayc":
      var sv = el.closest(a === "replay" ? ".tlbox" : ".acard").querySelector("svg");
      if (sv) { var cl = sv.cloneNode(true); sv.parentNode.replaceChild(cl, sv); }
      break;
    case "card": S.tense = +v; S.cstep = 0; S.more = false; S.nmiss = ""; go("card"); break;
    case "cstep": S.cstep = +v; S.more = false; S.nmiss = ""; go("card"); break;
    case "more": S.more = !S.more; render(); break;
    case "say2": x = DLG[ORDER[S.tense]]; say(x.a + " ... " + x.b); break;
    case "ntap":
      S.notice = S.notice || {};
      if (v === "1") { S.notice[ORDER[S.tense]] = true; S.nmiss = ""; PENDING = "ok"; }
      else { S.nmiss = el.getAttribute("data-w"); PENDING = "bad"; }
      save(); render(); break;
    case "ccq":
      x = v.split(":"); S.ccq = S.ccq || {}; var cid = ORDER[S.tense]; S.ccq[cid] = S.ccq[cid] || [];
      if (S.ccq[cid][+x[0]] === undefined || S.ccq[cid][+x[0]] === null) { S.ccq[cid][+x[0]] = x[1] === "1"; PENDING = (x[1] === "1") === CCQ[cid][+x[0]][1] ? "ok" : "bad"; save(); render(); }
      break;
    case "ccqreset": if (S.ccq) S.ccq[ORDER[S.tense]] = []; render(); break;
    case "pausetl": S.paused = !S.paused; document.body.classList.toggle("paused", !!S.paused); save(); render(); break;
    case "word": S.word = +v; render(); break;
    case "qn": S.qn = +v; render(); break;
    case "qv": S.qv = +v; render(); break;
    case "scen": S.scen = +v; render(); break;
    case "mset": x = v.split(":"); S.m[x[0]] = x[1]; render(); break;
    case "pair": S.cmp.pre = +v; S.cmp.custom = false; go("compare"); break;
    case "custom": S.cmp.custom = true; go("compare"); break;
    case "ca": x = v.split(":"); S.cmp.a[x[0]] = x[1]; render(); break;
    case "cb": x = v.split(":"); S.cmp.b[x[0]] = x[1]; render(); break;
    case "cq": var q = S.cq[S.cmp.pre]; if (q && q.pick < 0) { q.pick = q.o[+v]; PENDING = q.pick === 0 ? "ok" : "bad"; save(); render(); } break;
    case "cqreset": S.cq[S.cmp.pre] = null; delete S.cq[S.cmp.pre]; render(); break;
    case "part": openPart(v); break;
    case "jump": pState(getPart(S.part)).i = +v; go("part"); break;
    case "redo": delete S.parts[S.part]; openPart(S.part); break;
    case "ans": c = curItem(); if (!c.r.done) { c.r.pick = c.r.o[+v]; finishItem(c.r, c.r.pick === 0 ? 1 : 0); render(); } break;
    case "ssel": c = curItem(); if (!c.r.done) { c.r.sel = c.r.sel === +v ? -1 : +v; render(); } break;
    case "scol": c = curItem(); if (!c.r.done && c.r.sel >= 0) { c.r.place[c.r.sel] = +v; c.r.sel = -1; save(); render(); } break;
    case "sret": c = curItem(); if (!c.r.done) { delete c.r.place[+v]; save(); render(); } break;
    case "schk":
      c = curItem(); pr = 0;
      for (x = 0; x < c.it.it.length; x++) if (c.r.place[x] === c.it.it[x][1]) pr++;
      finishItem(c.r, pr, c.it.it.length); render(); break;
    case "opick": c = curItem(); if (!c.r.done) { c.r.built.push(c.r.pool.splice(+v, 1)[0]); save(); render(); } break;
    case "ounb": c = curItem(); if (!c.r.done) { c.r.pool.push(c.r.built.splice(+v, 1)[0]); save(); render(); } break;
    case "oclr": c = curItem(); if (!c.r.done) { c.r.pool = c.r.pool.concat(c.r.built); c.r.built = []; save(); render(); } break;
    case "ochk":
      c = curItem();
      var made = [], m2; for (m2 = 0; m2 < c.r.built.length; m2++) made.push(c.it.words[c.r.built[m2]]);
      var okk = made.join(" ") === c.it.words.join(" ");
      if (!okk && c.it.alt) for (m2 = 0; m2 < c.it.alt.length; m2++) if (made.join(" ") === c.it.alt[m2].join(" ")) okk = true;
      finishItem(c.r, okk ? 1 : 0); render(); break;
    case "spot": c = curItem(); if (!c.r.done) { c.r.pick = +v; finishItem(c.r, c.r.pick === c.it.bad ? 1 : 0); render(); } break;
    case "sgans":
      c = curItem(); if (c.r.done || c.r.showFb) break;
      c.r.picks.push(c.r.ords[c.r.g][+v]); c.r.showFb = true;
      var lastOk = c.r.picks[c.r.picks.length - 1] === 0;
      if (c.r.picks.length === c.it.g.length) { pr = 0; for (x = 0; x < c.r.picks.length; x++) if (c.r.picks[x] === 0) pr++; finishItem(c.r, pr, c.it.g.length); }
      PENDING = lastOk ? "ok" : "bad";
      save(); render(); break;
    case "sgnext": c = curItem(); c.r.g++; c.r.showFb = false; save(); render(); break;
    case "reset":
      if (!S.resetArm) { S.resetArm = true; render(); break; }
      var keep = S.size; S = freshState(); S.size = keep; STREAK = 0; save(); render(); break;
  }
}
document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-a]") : null;
  if (!el || el.disabled) return;
  act(el.getAttribute("data-a"), el.getAttribute("data-v"), el);
  effects();
});
document.addEventListener("keydown", function (e) {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && NAV.next) NAV.next();
  else if (e.key === "ArrowLeft" && NAV.back) NAV.back();
  else if (e.key === "Escape") go("home");
});
if (S.sizeV !== SIZE_V) { S.size = 1; S.sizeV = SIZE_V; save(); }
applySize();
if (S.paused) document.body.classList.add("paused");
render();
</script>
